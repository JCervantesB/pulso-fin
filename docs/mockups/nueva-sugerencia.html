<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulso · Nueva sugerencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="/" class="text-xl font-bold tracking-tight text-slate-900">Pulso</a>
      <nav class="flex items-center gap-4 text-sm">
        <a href="/" class="text-slate-600 hover:text-slate-900">Sugerencias</a>
        <span class="text-slate-500">ana@correo.com</span>
        <button type="button" class="rounded-md border border-slate-300 px-3 py-1.5 font-medium text-slate-700 hover:bg-slate-100">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-4 py-10">
    <a href="/" class="text-sm font-medium text-sky-700 hover:underline">← Volver a sugerencias</a>

    <div class="mt-4 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <h1 class="text-2xl font-bold text-slate-900">Nueva sugerencia</h1>
      <p class="mt-1 text-sm text-slate-500">Describe una idea concreta. Otras personas podrán leerla y votarla.</p>

      <form id="formulario-sugerencia" class="mt-6 space-y-5" novalidate>
        <div>
          <label for="titulo" class="block text-sm font-medium text-slate-700">Título</label>
          <input
            id="titulo"
            name="titulo"
            type="text"
            maxlength="120"
            placeholder="Una frase que resuma la idea"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
          />
        </div>

        <div>
          <label for="descripcion" class="block text-sm font-medium text-slate-700">Descripción</label>
          <textarea
            id="descripcion"
            name="descripcion"
            rows="5"
            placeholder="¿Qué problema resuelve? ¿Cómo imaginas que funcionaría?"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
          ></textarea>
        </div>

        <p id="mensaje-error" role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>

        <div class="flex items-center justify-end gap-3 pt-2">
          <a href="/" class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancelar</a>
          <button
            type="submit"
            class="rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2"
          >
            Enviar sugerencia
          </button>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
